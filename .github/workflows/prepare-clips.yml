# Fits the analyst's video clips to her photographs and rebuilds the in-between strips.
# Drop new clips into fin-lab/assets/clips/src/<greet|ack|work|bye>.mp4, then run this from
# the Actions tab.  ffmpeg comes with the GitHub runner image.
name: Prepare analyst clips

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated clip names to (re)fit, or empty for all: greet, ack, work, bye"
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: generate-images
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --quiet numpy opencv-python-headless pillow
          ffmpeg -version | head -1
      - name: Fit the clips, match the keyframes, build the in-between frames
        run: |
          python tools/prepare_clips.py --only "${{ inputs.only }}"
          python tools/match_frames.py
          python tools/morph_frames.py
      - name: Public data check
        run: python scripts/check_public_data.py
      - name: Commit
        run: |
          git add fin-lab/assets
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git -c user.name="scene-painter-bot" -c user.email="scene-painter-bot@users.noreply.github.com" \
            commit -m "Fit the analyst clips (${{ inputs.only || 'all' }})"
          git push origin HEAD
      - name: Redeploy the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${{ github.ref_name }}" || echo "::warning::Could not start the Pages workflow; push any commit to redeploy."
