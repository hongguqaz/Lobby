# 1. "check": on every push and pull request, make sure no raw data has been
#    committed and that data/dashboard.json is a well-formed aggregate.
# 2. "deploy": on the default branch, publish index.html + assets + data to
#    GitHub Pages.  First-time setup: Settings > Pages > Source: "GitHub Actions"
#    (the configure-pages step also tries to enable it automatically).
name: Check and deploy dashboard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No raw data committed, published data well-formed
        run: python scripts/check_public_data.py

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the static site
        run: |
          mkdir -p site
          cp index.html site/
          cp -r assets data site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
